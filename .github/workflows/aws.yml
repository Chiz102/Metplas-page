- name: Configure Nginx + SSL + Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSL_CRT: ${{ secrets.SSL_CRT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        with:
          host: ec2-98-92-130-146.compute-1.amazonaws.com
          username: ubuntu
          key: ${{ secrets.METPLAS }}
          envs: SSL_CRT,SSL_KEY
          script: |
            set -e

            # --- A) Install Nginx ---
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
              sudo systemctl enable --now nginx
            fi

            # --- B) Create SSL Files ---
            sudo mkdir -p /etc/nginx/ssl/metplastech.cl
            # Temporarily open permissions so we can write variables
            sudo chmod 777 /etc/nginx/ssl/metplastech.cl

            echo "$SSL_CRT" | sudo tee /etc/nginx/ssl/metplastech.cl/cert.crt > /dev/null
            echo "$SSL_KEY" | sudo tee /etc/nginx/ssl/metplastech.cl/privkey.key > /dev/null
            
            # Secure the folder and files specifically (Avoiding wildcard *)
            sudo chmod 700 /etc/nginx/ssl/metplastech.cl
            sudo chmod 600 /etc/nginx/ssl/metplastech.cl/cert.crt
            sudo chmod 600 /etc/nginx/ssl/metplastech.cl/privkey.key

            # --- C) Prepare Web Folder ---
            INDEX_DIR="$(dirname "$(sudo find /tmp/deploy-dist -maxdepth 8 -type f -name index.html | head -n 1)")"
            if [ -z "$INDEX_DIR" ]; then
              echo "ERROR: No index.html found"
              exit 1
            fi

            sudo mkdir -p /var/www/metplastech.cl/public_html
            sudo rm -rf /var/www/metplastech.cl/public_html/*
            sudo cp -r "$INDEX_DIR"/* /var/www/metplastech.cl/public_html

            sudo chown -R www-data:www-data /var/www/metplastech.cl
            sudo find /var/www/metplastech.cl -type d -exec chmod 755 {} \;
            sudo find /var/www/metplastech.cl -type f -exec chmod 644 {} \;

            # --- D) Write Nginx Config ---
            sudo tee /etc/nginx/sites-available/metplastech.cl >/dev/null <<'NGINX'
            server {
                listen 80;
                server_name metplastech.cl www.metplastech.cl;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl http2;
                server_name metplastech.cl www.metplastech.cl;

                root /var/www/metplastech.cl/public_html;
                index index.html index.php;

                ssl_certificate      /etc/nginx/ssl/metplastech.cl/cert.crt;
                ssl_certificate_key  /etc/nginx/ssl/metplastech.cl/privkey.key;

                ssl_protocols TLSv1.2 TLSv1.3;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX

            # --- E) Activate & Reload ---
            sudo ln -sf /etc/nginx/sites-available/metplastech.cl /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default || true

            sudo nginx -t
            sudo systemctl reload nginx
            
            echo "Deployment SUCCESS!"
