name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        # 🔴 THIS is where secrets become env vars
        env:
          SSL_CRT: ${{ secrets.SSL_CRT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}

        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22

          # 🔴 THIS forwards them into the SSH session
          envs: SSL_CRT,SSL_KEY

          script: |
            set -e

            echo "=== Installing Nginx if needed ==="
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt update
              sudo apt install -y nginx
              sudo systemctl enable --now nginx
            fi

            echo "=== Firewall ==="
            sudo ufw allow 'Nginx Full' || true

            echo "=== SSL directories ==="
            sudo mkdir -p /etc/nginx/ssl/metplastech.cl
            sudo chmod 700 /etc/nginx/ssl/metplastech.cl

            echo "=== Validating secrets ==="
            if [ -z "$SSL_CRT" ]; then
              echo "ERROR: SSL_CRT is empty"
              exit 1
            fi

            if [ -z "$SSL_KEY" ]; then
              echo "ERROR: SSL_KEY is empty"
              exit 1
            fi

            echo "=== Writing SSL certs from secrets ==="
            sudo tee /etc/nginx/ssl/metplastech.cl/cert.crt >/dev/null <<<"$SSL_CRT"
            sudo tee /etc/nginx/ssl/metplastech.cl/privkey.key >/dev/null <<<"$SSL_KEY"

            sudo chmod 600 /etc/nginx/ssl/metplastech.cl/cert.crt
            sudo chmod 600 /etc/nginx/ssl/metplastech.cl/privkey.key

            echo "=== Writing Nginx vhost ==="
            sudo tee /etc/nginx/sites-available/metplastech.cl >/dev/null <<'NGINX'
            server {
