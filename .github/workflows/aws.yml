name: Build & Deploy Angular (Nginx on EC2)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install & Build
      - name: Install & Build
        run: |
          npm ci
          npm run build

      # 4. PREPARE CONFIG FILES (Create them locally to avoid SSH errors)
      - name: Create Config Files
        env:
          SSL_CRT: ${{ secrets.SSL_CRT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        run: |
          # Create a 'configs' folder to hold our server files
          mkdir -p configs/ssl
          
          # 1. Save SSL Secrets to local files
          echo "$SSL_CRT" > configs/ssl/cert.crt
          echo "$SSL_KEY" > configs/ssl/privkey.key
          
          # 2. Create Nginx Config File
          cat > configs/metplastech.cl <<'EOF'
          server {
              listen 80;
              server_name metplastech.cl www.metplastech.cl;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              server_name metplastech.cl www.metplastech.cl;

              root /var/www/metplastech.cl/public_html;
              index index.html index.php;

              ssl_certificate      /etc/nginx/ssl/metplastech.cl/cert.crt;
              ssl_certificate_key  /etc/nginx/ssl/metplastech.cl/privkey.key;

              ssl_protocols TLSv1.2 TLSv1.3;

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          EOF

      # 5. Upload Everything (App + Configs) to EC2
      - name: Upload Artifacts to EC2
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          # We upload both the 'dist' folder and our new 'configs' folder
          path: dist/ configs/
          remote_path: /tmp/deploy-dist/
          remote_host: ec2-98-92-130-146.compute-1.amazonaws.com
          remote_user: ubuntu
          remote_key: ${{ secrets.METPLAS }}

      # 6. SSH: Move files to final destination (Simple & Safe)
      - name: Move Files & Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ec2-98-92-130-146.compute-1.amazonaws.com
          username: ubuntu
          key: ${{ secrets.METPLAS }}
          script: |
            set -e

            # --- A) Install Nginx if missing ---
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y nginx
              sudo systemctl enable --now nginx
            fi

            # --- B) Move SSL Certificates ---
            # We look for the 'configs/ssl' folder we uploaded to /tmp
            if [ -d "/tmp/deploy-dist/ssl" ]; then
              sudo mkdir -p /etc/nginx/ssl/metplastech.cl
              sudo chmod 777 /etc/nginx/ssl/metplastech.cl # Open briefly
              
              sudo cp /tmp/deploy-dist/ssl/cert.crt /etc/nginx/ssl/metplastech.cl/cert.crt
              sudo cp /tmp/deploy-dist/ssl/privkey.key /etc/nginx/ssl/metplastech.cl/privkey.key
              
              # Lock it down immediately
              sudo chmod 700 /etc/nginx/ssl/metplastech.cl
              sudo chmod 600 /etc/nginx/ssl/metplastech.cl/cert.crt
              sudo chmod 600 /etc/nginx/ssl/metplastech.cl/privkey.key
              echo "SSL Certs updated."
            fi

            # --- C) Move Website Files ---
            # Find the index.html inside the uploaded dist folder
            INDEX_PATH=$(find /tmp/deploy-dist -name index.html | head -n 1)
            INDEX_DIR=$(dirname "$INDEX_PATH")

            if [ -n "$INDEX_DIR" ]; then
              sudo mkdir -p /var/www/metplastech.cl/public_html
              sudo rm -rf /var/www/metplastech.cl/public_html/*
              sudo cp -r "$INDEX_DIR"/* /var/www/metplastech.cl/public_html/
              
              # Permissions
              sudo chown -R www-data:www-data /var/www/metplastech.cl
              sudo find /var/www/metplastech.cl -type d -exec chmod 755 {} \;
              sudo find /var/www/metplastech.cl -type f -exec chmod 644 {} \;
              echo "Website files updated."
            else
              echo "ERROR: No index.html found in upload!"
              exit 1
            fi

            # --- D) Move Nginx Config ---
            if [ -f "/tmp/deploy-dist/metplastech.cl" ]; then
              sudo cp /tmp/
