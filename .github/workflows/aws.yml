name: Build & Deploy Angular (Nginx on EC2)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Detect dist folder (print)
        run: |
          echo "dist contents:"
          ls -la dist
          echo "index.html locations:"
          find dist -maxdepth 6 -name index.html -print

      - name: Upload dist to EC2
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /tmp/deploy-dist/
          remote_host: ec2-98-92-130-146.compute-1.amazonaws.com
          remote_user: ubuntu
          remote_key: ${{ secrets.METPLAS }}

      - name: Configure Nginx + HTTPS + Deploy site
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ec2-98-92-130-146.compute-1.amazonaws.com
          username: ubuntu
          key: ${{ secrets.METPLAS }}
          envs: SSL_cert,SSL_KEY
          script: |
            set -e

            echo "=== Installing Nginx if needed ==="
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt update
              sudo apt install -y nginx
              sudo systemctl enable --now nginx
            fi

            echo "=== Firewall ==="
            sudo ufw allow 'Nginx Full' || true

            echo "=== SSL directories ==="
            sudo mkdir -p /etc/nginx/ssl/metplastech.cl
            sudo chmod 700 /etc/nginx/ssl/metplastech.cl

            echo "=== Writing SSL certs from secrets ==="
            sudo tee /etc/nginx/ssl/metplastech.cl/cert.crt >/dev/null <<<"$SSL_cert"
            sudo tee /etc/nginx/ssl/metplastech.cl/privkey.key >/dev/null <<<"$SSL_KEY"
            sudo chmod 600 /etc/nginx/ssl/metplastech.cl/*

            echo "=== Finding Angular build ==="
            INDEX_DIR="$(dirname "$(sudo find /tmp/deploy-dist -maxdepth 8 -type f -name index.html | head -n 1)")"
            if [ -z "$INDEX_DIR" ]; then
              echo "ERROR: index.html not found"
              exit 1
            fi
            echo "Using build dir: $INDEX_DIR"

            echo "=== Deploying web files ==="
            sudo mkdir -p /var/www/metplastech.cl/public_html
            sudo rm -rf /var/www/metplastech.cl/public_html/*
            sudo cp -r "$INDEX_DIR"/* /var/www/metplastech.cl/public_html/

            sudo chown -R www-data:www-data /var/www/metplastech.cl
            sudo chmod -R 755 /var/www/metplastech.cl

            echo "=== Writing Nginx vhost ==="
            sudo tee /etc/nginx/sites-available/metplastech.cl >/dev/null <<'NGINX'
            server {
                listen 80;
                server_name metplastech.cl www.metplastech.cl;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl http2;
                server_name metplastech.cl www.metplastech.cl;

                root /var/www/metplastech.cl/public_html;
                index index.html index.php;

                ssl_certificate     /etc/nginx/ssl/metplastech.cl/cert.crt;
                ssl_certificate_key /etc/nginx/ssl/metplastech.cl/privkey.key;

                ssl_protocols TLSv1.2 TLSv1.3;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            NGINX

            echo "=== Enabling site ==="
            sudo ln -sf /etc/nginx/sites-available/metplastech.cl /etc/nginx/sites-enabled/metplastech.cl
            sudo rm -f /etc/nginx/sites-enabled/default || true

            echo "=== Testing & Reloading Nginx ==="
            sudo nginx -t
            sudo systemctl reload nginx

            echo "=== DEPLOYMENT COMPLETE ==="
