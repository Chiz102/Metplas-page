name: Build & Deploy Angular (Nginx on EC2)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install Dependencies
      - name: Install deps
        run: npm ci

      # 4. Build Angular App
      - name: Build
        run: npm run build

      # 5. Verify Build Output (Optional debugging)
      - name: Detect dist folder (print)
        run: |
          echo "dist contents:"
          ls -la dist
          echo "index.html locations:"
          find dist -maxdepth 6 -name index.html -print

      # 6. Upload Build Artifacts to EC2 (Temporary Folder)
      - name: Upload dist to EC2
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /tmp/deploy-dist/
          remote_host: ec2-98-92-130-146.compute-1.amazonaws.com
          remote_user: ubuntu
          remote_key: ${{ secrets.METPLAS }}

      # 7. Configure Nginx + SSL + Deploy (Your Corrected Step)
      - name: Configure Nginx + SSL + Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          SSL_CRT: ${{ secrets.SSL_CRT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        with:
          host: ec2-98-92-130-146.compute-1.amazonaws.com
          username: ubuntu
          key: ${{ secrets.METPLAS }}
          envs: SSL_CRT,SSL_KEY
          script: |
            set -e

            # --- A) Install Nginx ---
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
              sudo systemctl enable --now nginx
            fi

            # --- B) Create SSL Files ---
            sudo mkdir -p /etc/nginx/ssl/metplastech.cl
            # Temporarily open permissions so we can write variables
            sudo chmod 777 /etc/nginx/ssl/metplastech.cl

            echo "$SSL_CRT" | sudo tee /etc/nginx/ssl/metplastech.cl/cert.crt > /dev/null
            echo "$SSL_
